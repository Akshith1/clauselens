# Databricks App runtime configuration.
command: ["streamlit", "run", "src/clauselens/app/streamlit_app.py", "--server.headless", "true"]
env:
  - name: CL_BACKEND
    value: databricks
  - name: PYTHONPATH
    value: src
  - name: CL_GATEWAY_ENDPOINT
    valueFrom: llm
  - name: CL_CATALOG
    value: workspace
  - name: CL_SCHEMA
    value: clauselens
  - name: CL_VS_ENDPOINT
    value: clauselens-vs
  - name: CL_POLICY_SOURCE
    value: databricks
  - name: CL_WAREHOUSE_ID
    valueFrom: warehouse
