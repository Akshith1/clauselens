name: Deploy to Azure Databricks

# Manual for now: Vector Search and the app bill by the hour, so deploy when you need them.
on:
  workflow_dispatch:

permissions:
  id-token: write   # GitHub OIDC token for Azure login (no stored cloud secrets)
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: azure-cli
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t dev
      - run: databricks bundle deploy -t dev
      - name: Refresh clauses and index
        run: databricks bundle run ingest_forms -t dev
      - name: Start the app
        run: databricks bundle run clauselens_app -t dev
