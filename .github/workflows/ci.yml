name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  eval:
    # Runs the question set against the real model when a Groq key is configured.
    needs: test
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CL_LOCAL_STORE: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Evaluation gate
        if: env.GROQ_API_KEY != ''
        run: python -m clauselens.eval.run
      - name: Skip notice
        if: env.GROQ_API_KEY == ''
        run: echo "GROQ_API_KEY secret not set; skipping the evaluation gate."
