# Serving endpoint that fronts Groq (OpenAI-compatible API) as an external model, with
# AI Gateway for governance. The app calls this endpoint; the Groq key stays in a secret.
resources:
  model_serving_endpoints:
    clauselens_llm:
      name: ${var.llm_endpoint}
      config:
        served_entities:
          - name: groq
            external_model:
              name: ${var.groq_model}
              provider: openai
              task: llm/v1/chat
              openai_config:
                openai_api_base: https://api.groq.com/openai/v1
                openai_api_key: "{{secrets/${var.groq_secret_scope}/groq-api-key}}"
      ai_gateway:
        usage_tracking_config:
          enabled: true
        inference_table_config:
          enabled: true
          catalog_name: ${var.catalog}
          schema_name: ${resources.schemas.clauselens_schema.name}
          table_name_prefix: llm_payloads
        rate_limits:
          - calls: 60
            key: user
            renewal_period: minute
# No PII guardrail: policy-record questions intentionally send the (synthetic) insured name
# and policy number to the model, which a PII block would reject.
