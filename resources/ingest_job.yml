# Job that parses the forms and refreshes the clauses table and Vector Search index.
resources:
  jobs:
    ingest_forms:
      name: clauselens-ingest-forms
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/ingest_forms.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              vs_endpoint: ${var.vs_endpoint}
